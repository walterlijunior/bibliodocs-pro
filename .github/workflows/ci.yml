# Integração contínua do BiblioDocs Pro: tipos, testes de unidade, auditoria de dependências, build e E2E no Electron
# real, num Windows do GitHub. Os testes externos (validador OOXML, LibreOffice e Word) rodam na máquina de quem
# desenvolve (`npm run test:externos`), porque precisam de programas que o runner não tem.
# Actions fixadas pelo hash do commit (cadeia de fornecimento); a tag está no comentário.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Dependências exatas do package-lock
        run: npm ci
      - name: Binário do Electron (conferido pelo SHA-256 do pacote electron)
        run: node node_modules/electron/install.js
      - name: Tipos, testes de unidade e auditoria (npm run verificar)
        run: npm run verificar
      - name: Inventário de licenças de terceiros
        run: node empacotamento/terceiros.cjs --conferir
      - name: Build e E2E no Electron real
        run: npm run test:e2e
      - name: Resultado do Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-resultados
          path: app/test-results/
          retention-days: 7
